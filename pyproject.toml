[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-defect-detection"
version = "0.1.0"
description = "Reference-based PCB defect detection prototype for DeepPCB pairs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "matplotlib",
    "scikit-learn",
    "torch",
    "torchvision",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
